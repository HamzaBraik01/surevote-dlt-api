databaseChangeLog:
  - changeSet:
      id: init-password-reset-tokens
      author: surevote
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_reset_token
              - column:
                  name: utilisateur_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reset_token_user
                    references: utilisateurs(id)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: used_at
                  type: TIMESTAMP
              - column:
                  name: used
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_reset_token_user
            tableName: password_reset_tokens
            columns:
              - column:
                  name: utilisateur_id

        - createIndex:
            indexName: idx_reset_token_token
            tableName: password_reset_tokens
            columns:
              - column:
                  name: token
