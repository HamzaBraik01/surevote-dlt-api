# =====================================================
# SUREVOTE — Test Configuration
# Overrides src/main/resources/application.properties
# =====================================================

# --- Server ---
server.port=0

# =====================================================
# DATABASE — Uses environment variables (CI provides PostgreSQL)
# Fallback to H2 for local dev without env vars
# =====================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:surevote_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =====================================================
# LIQUIBASE — Disable in tests (ddl-auto handles schema)
# =====================================================
spring.liquibase.enabled=false

# =====================================================
# JWT SECURITY — fixed test secret
# =====================================================
jwt.secret=test-secret-key-must-be-at-least-32-chars-long-for-hmac256
jwt.expiration=3600000
jwt.refresh-expiration=604800000
jwt.issuer=surevote-test

# =====================================================
# EMAIL — Disable real mail sending in tests
# =====================================================
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@surevote.test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# OTP settings
otp.expiry-minutes=5
otp.length=6

# Password reset
password-reset.expiry-minutes=15

# =====================================================
# SCHEDULING — disable in tests to avoid background noise
# =====================================================
spring.task.scheduling.pool.size=1

# =====================================================
# SPRINGDOC — minimal config for test context
# =====================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# =====================================================
# CORS
# =====================================================
cors.allowed-origins=http://localhost:4200

# =====================================================
# FILE UPLOAD
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
file.upload-dir=./uploads-test

# =====================================================
# LOGGING — reduce noise in test output
# =====================================================
logging.level.root=WARN
logging.level.ma.youcode.surevote=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
