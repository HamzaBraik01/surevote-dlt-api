# =====================================================
# SUREVOTE — CI/CD Pipeline
# Triggers: push & PR to main/develop
# Jobs:
#   1. test    — Compile, run tests, enforce JaCoCo coverage
#   2. build   — Build & push Docker image to GHCR
#   3. deploy  — (optional) Deploy to production
# =====================================================

name: SureVote CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ─────────────────────────────────────────────────────
  # JOB 1 — Test & Quality Gate
  # ─────────────────────────────────────────────────────
  test:
    name: 🧪 Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: surevote_test_db
          POSTGRES_USER: surevote_user
          POSTGRES_PASSWORD: surevote_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surevote_user -d surevote_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 📦 Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🔧 Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: 🔨 Compile project
        run: ./mvnw compile -q -B

      - name: 🧪 Run tests with coverage
        run: ./mvnw verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/surevote_test_db
          DB_DRIVER: org.postgresql.Driver
          DB_USER: surevote_user
          DB_PASSWORD: surevote_pass
          JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-hmac-sha256-algorithm-needs
          JWT_EXPIRATION: 3600000
          JWT_REFRESH_EXPIRATION: 604800000
          MAIL_HOST: smtp.localhost
          MAIL_PORT: 587
          MAIL_USERNAME: test@test.com
          MAIL_PASSWORD: testpass

      - name: 📊 Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: 📋 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  # JOB 2 — Build & Push Docker Image
  # ─────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
